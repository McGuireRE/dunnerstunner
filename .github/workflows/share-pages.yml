name: Quiet Listings share pages
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: share-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/share-pages.mjs
      - name: Commit if changed
        run: |
          git config user.name "Quiet Listings bot"
          git config user.email "actions@users.noreply.github.com"
          git add quiet/q
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Quiet Listings share pages"
          git push
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds || true
