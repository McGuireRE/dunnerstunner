<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Listings | McGuire Real Estate</title>
<meta name="description" content="Private, off-market property in Dunedin for qualified buyers. For serious and discerning buyers only.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16181D; --ink2: #23262D; --bg: #FAF8F5; --surface: #FFFFFF; --line: #E7E2DB; --line2: #D8D1C7;
  --muted: #6B675F; --accent: #EB4A33; --accent-dark: #C93A25; --accent-soft: #FDEEEA; --gold: #B08D57;
  --ok: #2F7A4E; --ok-soft: #E7F3EC; --warn: #9A6400; --warn-soft: #FBF1DE; --bad: #B23A2A; --bad-soft: #FBEAE7;
  --radius: 10px; --shadow: 0 1px 2px rgba(22,24,29,.06), 0 4px 16px rgba(22,24,29,.06);
  --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--sans); font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--bg); }
a { color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3 { line-height: 1.15; margin: 0 0 .4em; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(36px, 6vw, 64px); letter-spacing: -.01em; }
h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(28px, 4vw, 40px); }
h3 { font-size: 19px; font-weight: 600; }
p { margin: 0 0 1em; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 760px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }
.eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 13px; font-weight: 600; color: var(--gold); }
.hidden { display: none !important; }

/* header */
.top { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 18px; height: 68px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
.brand img { height: 36px; width: auto; }
.brand .ql { font-family: var(--serif); font-size: 27px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.nav { display: flex; gap: 4px; align-items: center; flex: 1; }
.nav a { text-decoration: none; font-weight: 500; font-size: 15.5px; color: var(--ink2); padding: 8px 12px; border-radius: 6px; white-space: nowrap; }
.nav a:hover, .nav a.on { background: var(--bg); color: var(--ink); }
.nav .ext::after { content: "↗"; font-size: 12px; margin-left: 3px; color: var(--muted); }
.nav-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; margin-left: auto; }
@media (max-width: 960px) {
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; top: 68px; left: 0; right: 0; background: #fff; border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; padding: 10px 20px 16px; box-shadow: var(--shadow); }
  .nav.open { display: flex; }
  .nav a { padding: 12px 8px; font-size: 17px; }
  .nav-right { margin: 8px 0 0; flex-wrap: wrap; }
  .brand .ql { font-size: 23px; }
}
@media (max-width: 400px) { .brand .ql { font-size: 21px; } }

/* buttons + forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px var(--sans); padding: 12px 20px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; min-height: 46px; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.dark:hover { background: var(--ink2); }
.btn.ghost { background: #fff; border-color: var(--line2); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.light { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.btn.light:hover { border-color: #fff; }
.btn.link { background: none; border: none; padding: 6px 4px; min-height: 0; color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.btn.sm { padding: 8px 14px; font-size: 15px; min-height: 38px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
label.f, .legend { display: block; font-weight: 600; font-size: 15.5px; margin: 18px 0 6px; }
.opt { font-weight: 400; color: var(--muted); }
.hint { font-size: 14.5px; color: var(--muted); margin: -2px 0 8px; }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea {
  width: 100%; font: 16.5px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line2); border-radius: 8px; padding: 12px 13px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: 0; border-color: var(--ink); }
textarea { min-height: 110px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 0; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.choice { position: relative; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line2); background: #fff; border-radius: 8px; padding: 12px 14px; cursor: pointer; font-size: 16px; }
.choice input { width: 18px; height: 18px; accent-color: var(--ink); flex-shrink: 0; margin: 0; }
.choice:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: #FDFCFA; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line2); background: #fff; border-radius: 999px; padding: 7px 14px; font: 500 15px var(--sans); cursor: pointer; color: var(--ink2); }
.chip:hover { border-color: var(--ink); }
.chip.on, .chip:has(input:checked) { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip input { display: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
@media (max-width: 600px) { .row2, .row3 { grid-template-columns: 1fr; } }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--ink); flex-shrink: 0; }
.err { background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: 8px; font-size: 15px; margin: 14px 0 0; }
.note { background: var(--warn-soft); color: #5E4300; padding: 12px 14px; border-radius: 8px; font-size: 15.5px; margin: 14px 0; }
.okbox { background: var(--ok-soft); color: #1E5235; padding: 12px 14px; border-radius: 8px; font-size: 15.5px; margin: 14px 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin: 0 0 16px; }
.card.tight { padding: 16px; }
.card h3:first-child, .card h2:first-child { margin-top: 0; }
.pill { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--line); color: var(--ink2); white-space: nowrap; }
.pill.pending, .pill.info, .pill.draft { background: var(--warn-soft); color: var(--warn); }
.pill.approved, .pill.live { background: var(--ok-soft); color: var(--ok); }
.pill.declined, .pill.suspended, .pill.withdrawn { background: var(--bad-soft); color: var(--bad); }
.pill.under_offer { background: #EAF0FB; color: #2B4E8C; }
.pill.new { background: var(--accent-soft); color: var(--accent-dark); }
.pill.to_market { background: #EFE6D6; color: #7A5A26; }
@media (max-width: 600px) { .mxwrap { grid-template-columns: 1fr !important; justify-items: center; } }

/* landing */
.hero { background: radial-gradient(1200px 500px at 70% -10%, #2A2D35 0%, var(--ink) 60%); color: #F4F0EA; padding: 90px 0 80px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -10% -60% 40%; height: 120%; background: radial-gradient(closest-side, rgba(176,141,87,.18), transparent); pointer-events: none; }
.hero h1 { color: #fff; max-width: 820px; }
.hero .lede { font-size: clamp(18px, 2.2vw, 21px); color: #CFC8BE; max-width: 640px; margin-bottom: 30px; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; max-width: 980px; position: relative; z-index: 1; }
@media (max-width: 820px) { .opts { grid-template-columns: 1fr; } }
.opt-tile { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #E8E1D6; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 22px; transition: background .15s, border-color .15s, transform .15s; }
.opt-tile:hover { background: rgba(255,255,255,.09); border-color: var(--gold); transform: translateY(-2px); }
.opt-tile .n { font-family: var(--serif); font-size: 40px; line-height: 1; color: var(--gold); }
.opt-tile strong { font-family: var(--serif); font-weight: 500; font-size: 30px; color: #fff; line-height: 1.1; }
.opt-tile span:not(.n) { font-size: 16px; color: #CFC8BE; }
.opt-tile em { font-style: normal; font-weight: 600; color: #fff; margin-top: auto; padding-top: 10px; font-size: 15.5px; }
.serious { display: inline-flex; align-items: center; gap: 10px; margin-top: 34px; border: 1px solid rgba(176,141,87,.5); color: #E6D3B3; padding: 9px 16px; border-radius: 999px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.stat { margin-top: 26px; color: #CFC8BE; font-size: 16px; }
.stat strong { color: #fff; font-family: var(--serif); font-size: 30px; font-weight: 500; margin-right: 6px; }
.band { padding: 72px 0; }
.band.alt { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.band.dark { background: var(--ink); color: #EDE8E0; }
.band.dark h2 { color: #fff; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 30px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 30px; }
@media (max-width: 960px) { .grid4 { grid-template-columns: repeat(2, 1fr); } .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .grid4 { grid-template-columns: 1fr; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.band.dark .tile { background: var(--ink2); border-color: #33363E; }
.tile .num { font-family: var(--serif); font-size: 34px; color: var(--gold); line-height: 1; margin-bottom: 10px; }
.tile p { margin: 0; font-size: 16px; color: var(--muted); }
.band.dark .tile p { color: #B9B2A8; }
.logic { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
@media (max-width: 860px) { .logic { grid-template-columns: 1fr; } }
.meter { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.meter .rowm { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.meter .rowm:last-child { border-bottom: 0; }
.yes { color: var(--ok); font-weight: 600; } .no { color: var(--muted); font-weight: 600; }
.foot { background: var(--ink); color: #A9A297; padding: 40px 0; font-size: 15px; }
.foot a { color: #E6DED2; }
.foot .cols { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }

/* listings */
.searchbar { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 0; }
.sb-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 860px) { .sb-grid { grid-template-columns: 1fr 1fr; } .sb-grid > :first-child { grid-column: 1 / -1; } }
.results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 26px 0 14px; }
.results-head h1 { font-size: clamp(28px, 4vw, 38px); margin: 0; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
@media (max-width: 1000px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
.lcard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: box-shadow .2s, transform .2s; display: flex; flex-direction: column; }
.lcard:hover { box-shadow: 0 6px 24px rgba(22,24,29,.10); }
.ph { position: relative; aspect-ratio: 3 / 2; background: #EDE8E1; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--serif); font-size: 22px; }
.ph .badge { position: absolute; left: 12px; top: 12px; background: rgba(22,24,29,.85); color: #F1E6D2; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 5px 10px; border-radius: 4px; }
.ph .badge.uo { left: auto; right: 56px; background: #2B4E8C; color: #fff; }
.ph .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); cursor: pointer; display: none; place-items: center; font-size: 18px; color: var(--ink); }
.ph:hover .arrow { display: grid; }
@media (hover: none) { .ph .arrow { display: grid; } }
.ph .arrow.l { left: 10px; } .ph .arrow.r { right: 10px; }
.ph .count { position: absolute; right: 12px; bottom: 12px; background: rgba(22,24,29,.75); color: #fff; font-size: 13px; padding: 3px 8px; border-radius: 4px; }
.heart { position: absolute; right: 12px; top: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.95); display: grid; place-items: center; cursor: pointer; }
.heart svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2; }
.heart.on svg { fill: var(--accent); stroke: var(--accent); }
.wm { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; color: rgba(255,255,255,.28); font-weight: 600; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.25); transform: rotate(-18deg); white-space: nowrap; }
.lbody { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; text-decoration: none; }
.price { font-weight: 700; font-size: 19px; }
.addr { font-size: 16px; color: var(--ink2); }
.headline { font-size: 15px; color: var(--muted); }
.facts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; color: var(--ink2); font-size: 15.5px; }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.facts svg { width: 20px; height: 20px; stroke: var(--ink2); fill: none; stroke-width: 1.6; }
.lfoot { display: flex; justify-content: space-between; color: var(--muted); font-size: 13.5px; margin-top: auto; padding-top: 12px; }
.hiddenbar { background: var(--ink); color: #E8E1D6; border-radius: var(--radius); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 22px; }
.hiddenbar strong { color: #fff; }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty h2 { color: var(--ink); }

/* detail */
.gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; height: min(62vh, 560px); border-radius: var(--radius); overflow: hidden; margin-top: 18px; position: relative; }
.gallery .g { position: relative; background: #EDE8E1; cursor: zoom-in; overflow: hidden; }
.gallery .g img { width: 100%; height: 100%; object-fit: cover; }
.gallery .g:first-child { grid-row: 1 / 3; }
.gallery.n1 { grid-template-columns: 1fr; } .gallery.n1 .g:first-child { grid-row: 1 / 3; }
.gallery.n2 { grid-template-columns: 2fr 1fr; } .gallery.n2 .g:nth-child(2) { grid-row: 1 / 3; }
.gallery.n3 { grid-template-columns: 2fr 1fr; }
.gallery .all { position: absolute; right: 14px; bottom: 14px; }
@media (max-width: 760px) { .gallery, .gallery.n2, .gallery.n3 { grid-template-columns: 1fr; height: 300px; } .gallery .g:not(:first-child) { display: none; } }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px; margin: 26px 0 60px; }
@media (max-width: 960px) { .detail { grid-template-columns: 1fr; } }
.detail .price { font-size: 26px; }
.detail h1 { font-size: clamp(26px, 3.6vw, 36px); margin: 4px 0 6px; }
.detail .facts { font-size: 17px; gap: 22px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 16px 0 22px; }
.detail .facts svg { width: 24px; height: 24px; }
.desc p { font-size: 17px; }
.kv { width: 100%; border-collapse: collapse; font-size: 16px; }
.kv td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.kv td:first-child { color: var(--muted); width: 45%; padding-right: 12px; }
.featlist { columns: 2; padding-left: 20px; margin: 0; } .featlist li { margin: 4px 0; break-inside: avoid; }
@media (max-width: 560px) { .featlist { columns: 1; } }
.side { position: sticky; top: 90px; align-self: start; }
.agent { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.agent .av { width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: #F1E6D2; display: grid; place-items: center; font-family: var(--serif); font-size: 24px; flex-shrink: 0; }
.conf { font-size: 14px; color: var(--muted); border-left: 3px solid var(--gold); padding: 4px 0 4px 12px; margin: 22px 0; }
.lightbox { position: fixed; inset: 0; background: rgba(10,11,13,.96); z-index: 100; display: flex; align-items: center; justify-content: center; }
.lightbox img { max-width: 92vw; max-height: 84vh; object-fit: contain; }
.lightbox .wm { color: rgba(255,255,255,.18); font-size: 18px; }
.lightbox button { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; }
.lightbox .x { top: 16px; right: 16px; } .lightbox .pv { left: 16px; top: 50%; } .lightbox .nx { right: 16px; top: 50%; }
.lightbox .cap { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: #bbb; font-size: 14px; }

/* wizard */
.wz { padding: 36px 0 120px; }
.steps { display: flex; gap: 6px; margin: 0 0 26px; }
.steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps span.on { background: var(--ink); }
.wz h1 { font-size: clamp(30px, 4.5vw, 44px); }
.wz-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; }
.crit { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; margin: 6px 0; }
.crit .n { font-family: var(--serif); font-size: 22px; text-align: center; color: var(--gold); }
.crit .mv { display: flex; gap: 2px; }
.crit .mv button { border: 1px solid var(--line2); background: #fff; border-radius: 6px; width: 34px; height: 34px; cursor: pointer; }
.uploads li { font-size: 15px; margin: 4px 0; }

/* admin */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 24px 0 20px; overflow-x: auto; }
.tabs a { padding: 10px 14px; text-decoration: none; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--ink); border-color: var(--accent); }
.tbl { width: 100%; border-collapse: collapse; font-size: 15.5px; background: #fff; }
.tbl th, .tbl td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: #FDFBF8; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 140px; }
.thumb img { width: 140px; height: 94px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.thumb .ctl { display: flex; justify-content: space-between; margin-top: 3px; }
.thumb .ctl button { border: 1px solid var(--line2); background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; padding: 2px 7px; }
.thumb .cov { position: absolute; left: 6px; top: 6px; background: var(--ink); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 3px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; }
@media (max-width: 960px) { .split { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 8px; z-index: 200; font-size: 15.5px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.loading { padding: 100px 0; text-align: center; color: var(--muted); }
.prose h2 { margin-top: 1.4em; font-size: 28px; }
