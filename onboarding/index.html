<style>
/* Layout: one calm reading column (max 640px) with a sticky progress header and a sticky action bar, built for a vendor on a phone. */
:root {
  --bg: #F7F5F2;          /* page */
  --surface: #FFFFFF;     /* cards */
  --ink: #2B2A28;         /* text */
  --muted: #6E6A65;       /* secondary text */
  --line: #E4E0DA;        /* rules */
  --accent: #D9432C;      /* McGuire tomato, darkened for AA contrast on white */
  --accent-soft: #FBEDEA; /* accent tint */
  --ok: #2F7D4F;          /* confirmed */
  --ok-soft: #E8F3EC;
  --warn: #9A5B00;
  --warn-soft: #FFF4E0;
  --banner: #2B2A28;
  --banner-ink: #F7F5F2;
  --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181716; --surface: #222120; --ink: #F2EEE9; --muted: #A8A29B; --line: #3A3835;
    --accent: #F0644C; --accent-soft: #3A2420; --ok: #6CC490; --ok-soft: #1E3326;
    --warn: #F0B45A; --warn-soft: #3A2E1A; --banner: #0F0E0D; --banner-ink: #F2EEE9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181716; --surface: #222120; --ink: #F2EEE9; --muted: #A8A29B; --line: #3A3835;
  --accent: #F0644C; --accent-soft: #3A2420; --ok: #6CC490; --ok-soft: #1E3326;
  --warn: #F0B45A; --warn-soft: #3A2E1A; --banner: #0F0E0D; --banner-ink: #F2EEE9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.proto { background: var(--banner); color: var(--banner-ink); font-size: 13.5px; text-align: center; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 640px; margin: 0 auto; padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand img { height: 30px; width: auto; display: block; }
.logo-dark { display: none !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-dark { display: block !important; } :root:not([data-theme="light"]) .logo-light { display: none !important; } }
:root[data-theme="dark"] .logo-dark { display: block !important; }
:root[data-theme="dark"] .logo-light { display: none !important; }
.mode-btn { font: inherit; font-size: 13.5px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mode-btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.brand-right { display: flex; align-items: center; gap: 10px; }
.gcard ul { margin: 10px 0 12px; padding-left: 20px; }
.gcard li { margin: 4px 0; }
.gcard .choice { margin-top: 4px; }
.gcard.done { border-color: var(--ok); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset[disabled] { opacity: .75; }
.upl img { display: block; max-width: 100%; max-height: 180px; border-radius: 6px; margin-top: 10px; }
.agent-flag { display: inline-block; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 3px 8px; margin-bottom: 12px; }
.step-count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s ease; }
.step-name { font-size: 14px; color: var(--muted); margin-top: 6px; }

main { max-width: 640px; margin: 0 auto; padding-block: 28px 140px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { display: none; }
.screen.active { display: block; animation: rise .3s ease; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h1:focus { outline: none; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 7vw, 44px); line-height: 1.08; margin: 0 0 12px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.15; margin: 32px 0 8px; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
p { margin: 0 0 14px; }
.lede { font-size: 18.5px; color: var(--muted); max-width: 34em; }
.small { font-size: 14.5px; color: var(--muted); }
.clause { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
a { color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin: 14px 0; }
.card.tight { padding: 14px 16px; }
.card.note { background: var(--accent-soft); border-color: transparent; }
.card.okc { background: var(--ok-soft); border-color: transparent; }
.card.warnc { background: var(--warn-soft); border-color: transparent; }
.prefill { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.prefill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

.steps-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.steps-list li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); }
.steps-list li:last-child { border-bottom: none; }
.steps-list .n { font-family: var(--display); font-size: 22px; color: var(--accent); }
.steps-list .t { font-size: 14px; color: var(--muted); white-space: nowrap; }

label.f { display: block; font-size: 15px; font-weight: 500; margin: 16px 0 6px; }
label.f .opt { font-weight: 400; color: var(--muted); }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; min-width: 0;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2 > * { min-width: 0; }
.row2 label.f { margin-top: 12px; }
@media (max-width: 460px) { .row2.stack { grid-template-columns: 1fr; } }

.choices { display: grid; gap: 8px; margin: 8px 0; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice { position: relative; display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice .mark { flex: none; width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 50%; margin-top: 2px; display: grid; place-items: center; }
.choice.cb .mark { border-radius: 4px; }
.choice .mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .15s; }
.choice.cb .mark::after { border-radius: 2px; }
.choice:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.choice:has(input:checked) .mark { border-color: var(--accent); }
.choice:has(input:checked) .mark::after { transform: scale(1); }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice .ct { display: block; font-weight: 500; }
.choice .cd { display: block; font-size: 14.5px; color: var(--muted); margin-top: 2px; }
.choice.locked { cursor: default; background: var(--bg); }
.choice.locked .mark { border-color: var(--ok); background: var(--ok); }
.choice.locked .mark::after { content: "✓"; background: none; color: var(--surface); transform: none; width: auto; height: auto; font-size: 13px; line-height: 1; font-weight: 700; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.fact { padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.fact .k { font-size: 13.5px; color: var(--muted); }
.fact .v { font-weight: 500; overflow-wrap: anywhere; }
.money { font-variant-numeric: tabular-nums; }
.big { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--accent); }
table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sum td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.sum td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
table.sum tr.total td { border-bottom: none; border-top: 2px solid var(--ink); font-weight: 600; padding-top: 12px; }

details.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; }
details.acc summary { list-style: none; cursor: pointer; padding: 15px 44px 15px 16px; position: relative; font-weight: 500; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; position: absolute; right: 16px; top: 12px; font-size: 22px; color: var(--accent); }
details.acc[open] summary::after { content: "–"; }
details.acc summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }
details.acc .in { padding: 0 16px 16px; }
details.acc .in ul { margin: 0 0 10px; padding-left: 20px; }
details.acc .in li { margin: 4px 0; }
.read-tick { font-size: 13px; color: var(--ok); font-weight: 600; margin-left: 6px; }

.ack { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ack:last-child { border-bottom: none; }
.ack input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 3px; }
.ack .what { font-weight: 500; }
.ack .how { font-size: 14.5px; color: var(--muted); margin-top: 3px; }
.ack .how a { white-space: nowrap; }

.sig-wrap { border: 1px dashed var(--muted); border-radius: 8px; background: var(--surface); position: relative; touch-action: none; }
.sig-wrap canvas { display: block; width: 100%; height: 150px; cursor: crosshair; }
.sig-wrap .hint { position: absolute; left: 14px; bottom: 10px; font-size: 13px; color: var(--muted); pointer-events: none; }
.sig-line { position: absolute; left: 14px; right: 14px; bottom: 34px; border-bottom: 1px solid var(--line); pointer-events: none; }
.signed-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 600; font-size: 15px; }

.status { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; }
.status.pending { background: var(--warn-soft); color: var(--warn); }
.status.done { background: var(--ok-soft); color: var(--ok); }

.btn { font: inherit; font-weight: 600; font-size: 16.5px; border-radius: 8px; padding: 13px 20px; border: 1px solid transparent; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.link { background: none; border: none; color: var(--accent); padding: 6px 0; font-weight: 500; text-decoration: underline; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.actions-in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.actions-in .btn.primary { flex: 1; }
.err { color: var(--accent); font-size: 14.5px; font-weight: 500; margin-top: 10px; min-height: 0; }
.err:empty { display: none; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 15px; cursor: pointer; }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chip input { accent-color: var(--accent); }
.reveal[hidden] { display: none !important; }
hr.soft { border: none; border-top: 1px solid var(--line); margin: 24px 0; }
@media (max-width: 420px) { .facts { grid-template-columns: 1fr; } .choices.two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<body>
<style>
.view-pad { padding-bottom: 40px; }
.login-card { max-width: 440px; margin: 8vh auto 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15.5px; }
.tbl td, .tbl th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 13px; color: var(--muted); font-weight: 500; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--accent-soft); }
.pill { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--line); color: var(--ink); white-space: nowrap; }
.pill.sent, .pill.parked { background: var(--warn-soft); color: var(--warn); }
.pill.signed, .pill.countersigned { background: var(--ok-soft); color: var(--ok); }
.pill.cancelled, .pill.ended { background: var(--line); color: var(--muted); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 6px; }
.toolbar .btn { padding: 10px 16px; font-size: 15.5px; }
.sigimg { max-width: 100%; height: 90px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.copybox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 15px; z-index: 20; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
.loading { text-align: center; color: var(--muted); padding: 60px 0; }
@media print {
  .proto, header.top, .actions, .toolbar, .no-print { display: none !important; }
  body { background: #fff; color: #000; font-size: 12pt; }
  main { padding: 0 !important; max-width: none; }
  .card { border: 1px solid #bbb; break-inside: avoid; }
}
</style>

  function initPad(id) {
    const cv = $('#' + id); if (!cv) return;
    padDrawn = false;
    const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    cv.width = Math.max(1, r.width * dpr); cv.height = 150 * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1a1a';
    let drawing = false, last = null;
    const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
    cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; padDrawn = true; const h = cv.parentElement.querySelector('.hint'); if (h) h.hidden = true; });
    const end = () => { drawing = false; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    return () => { ctx.clearRect(0, 0, cv.width, cv.height); padDrawn = false; const h = cv.parentElement.querySelector('.hint'); if (h) h.hidden = false; };
  }

      <div class="err"></div></div>`;
    $$('[data-m]').forEach(el => {
      const k = el.dataset.m, ev = (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT') ? 'change' : 'change';
      el.addEventListener(ev, async () => {
        if (el.type === 'radio') { if (!el.checked) return; r[k] = el.value; await log(k === 'risk' ? 'Risk rated ' + el.value : k === 'method' ? 'Verification method: ' + el.closest('label').querySelector('.ct').textContent : 'Level of checks: ' + el.value); }
        else if (el.type === 'checkbox') { r[k] = el.checked; if (el.checked && k === 'f2f') await log('Original ID sighted in person, likeness confirmed'); }
        else r[k] = el.value;
        await persist();
        if (el.type === 'radio' || el.tagName === 'SELECT') viewAml(agId, personId);
      });
    });
    $$('[data-up]').forEach(inp => inp.addEventListener('change', async () => {
      const fl = inp.files && inp.files[0]; if (!fl) return;
      const ext = (fl.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = `aml/${file.id}/${inp.dataset.up}-${Date.now()}.${ext}`;
      await must(sb.storage.from('private').upload(path, fl, { contentType: fl.type || 'application/octet-stream' }));
      r.up[inp.dataset.up] = { path, name: fl.name, img: (fl.type || '').startsWith('image/') };
      await persist(); await log('Attached: ' + inp.closest('.upl').querySelector('span').textContent);
      viewAml(agId, personId);
    }));
    const an = $('#addNote'); if (an) an.addEventListener('click', async () => { const t = $('#amlNote').value.trim(); if (t) { await log('Note: ' + t); viewAml(agId, personId); } });
    const missing = () => {
      const m = [];
      if (!r.cdd) m.push('level of checks');
      if (r.method === 'electronic') { if (!r.up.provReport && !person.id_verified_at) m.push('the provider report'); }
      else {
        if (!r.idType) m.push('photo ID type'); if (!r.expiry) m.push('ID expiry'); if (!r.up.idPhoto) m.push('photo of the ID');
        if (r.method === 'f2f' && !r.f2f) m.push('confirmation you met them in person');
        if (r.method === 'cert' && (!r.certName || !r.certDate || !String(r.certReason || '').trim())) m.push('certification details and reason');
        if (needSecond && !r.secType) m.push('second ID');
      }
      if (!r.dob) m.push('date of birth'); if (!r.addrDoc) m.push('address proof');
      if (!r.pep || !r.sanc || !r.screenedAt) m.push('screening results and date');
      if (r.cdd === 'Enhanced' && (!String(r.bo || '').trim() || !String(r.sof || '').trim())) m.push('ownership and source of funds');
      if (!r.risk) m.push('risk rating'); if (r.risk && r.risk !== 'Low' && !String(r.riskWhy || '').trim()) m.push('reason for the risk rating');
      return m;
    };
    actions(true, 'Back to agreement', L ? '' : 'Complete and lock file');
    onBack = () => viewAgentDetail(agId);
    onNext = async () => {
      $$('[data-m]').forEach(el => { if (el.type !== 'radio' && el.type !== 'checkbox') r[el.dataset.m] = el.value; });
      await persist();
      const m = missing();
      if (m.length) { const e = $('.err', main()); e.textContent = 'Still needed: ' + m.join(', ') + '.'; e.scrollIntoView({ block: 'center' }); return; }
      await must(sb.from('aml_files').update({ locked_at: new Date().toISOString(), locked_by: 'Tim McGuire, compliance officer' }).eq('id', file.id));
      toast('AML file locked'); viewAml(agId, personId);
    };
    top();
  }

  async function viewLawyer(token) {
    header('Read-only review', '', 0); actions(false); $('#signOut').hidden = true;
    let d;
    try {
      const r = await fetch(`${SB_URL}/functions/v1/lawyer-view?token=${encodeURIComponent(token)}`, { headers: { apikey: SB_KEY } });
      d = await r.json();
      if (!r.ok) throw new Error(d.error || 'This link isn\'t valid.');
    } catch (e) { main().innerHTML = `<div class="login-card"><h1>Link not available</h1><p class="lede">${esc(e.message)}</p><p class="small">Tim McGuire · 027 562 7207 · tim@mcguire.co.nz</p></div>`; return; }
    const ag = d.agreement, c = ag.config || {}, an = ag.answers || {}, pk = pkgOf(c), later = pk.name === 'Later' || an.mkt === 'later';
    const row = (k, v) => `<tr><td>${k}</td><td style="white-space:normal">${v}</td></tr>`;
    main().innerHTML = `<div class="view-pad">
      <span class="agent-flag">Read-only · for ${esc(d.lawyer.name)}</span>
      <h1>${esc(ag.address)}</h1>
      <p class="lede">Draft Sole and Exclusive Agency Agreement prepared by McGuire Real Estate for ${esc((d.people || []).map(p => p.legal_name).filter(Boolean).join(' and '))}. ${ag.signed_at ? 'Signed ' + esc(fmtDT(ag.signed_at)) + '.' : 'Not yet signed.'}</p>
      <p class="small">${esc(ag.ref)} · ${esc(ag.agreement_version)}</p>
      <div class="toolbar no-print"><button class="btn ghost" type="button" onclick="window.print()">Print or save as PDF</button></div>
      <h2>Appointment of agency (front page)</h2>
      <div class="card"><table class="sum">
        ${row('A. Client(s)', esc((d.people || []).map(p => p.legal_name).filter(Boolean).join(' and ')) + (an.capacity && an.capacity !== 'Owners' ? `, as ${esc(an.capacity.toLowerCase())} for ${esc(an.entity || '')}` : '') + `<br><span class="small">GST registered: ${an.gst === 'yes' ? 'Yes' : 'No'}</span>`)}
        ${row('B. Property', esc(ag.address) + (c.owners ? `<br><span class="small">Registered owners: ${esc(c.owners)}${c.title ? ' · ' + esc(c.title) : ''}</span>` : ''))}
        ${row('C. Commencement', c.appr === 'pending' ? 'On receipt of written appraisal' : esc(c.start ? fmtDate(c.start) : 'On signing') + '. Review date 90 days after commencement')}
        ${row('D. Commission', `${money(num(c.flat))} for a sale price up to ${money(num(c.thr))}, plus ${esc(c.pct)}% of the portion above, plus GST` + (c.appr === 'pending' ? '' : `<br><span class="small">At ${money(num(c.ask))}: ${money(r2(commission(c, num(c.ask))))} plus GST</span>`))}
        ${row('E. Costs on signing', [limAmt(c) ? 'LIM ' + money(limAmt(c)) : '', adminAmt(c) ? 'administration fee ' + money(adminAmt(c)) : '', 'marketing ' + (later ? 'to be agreed' : esc(pk.label) + ' ' + money(pk.amt))].filter(Boolean).join(', ') + ' (including GST)' + (an.pay ? `<br><span class="small">Payment via List Now: ${esc(an.pay)}</span>` : ''))}
        ${c.method ? row('Method of sale', esc(c.method)) : ''}
        ${c.appr === 'pending' ? row('Condition', 'Takes effect on receipt of a written appraisal. The client may cancel within 2 working days of receiving it, at no cost.') : ''}
        ${row('Cancellation', c.approach === 'unsolicited' ? 'Unsolicited approach: the client may cancel within 5 working days of receiving a copy.' : 'The client may cancel by 5pm on the first working day after receiving a copy (s130 REAA 2008).')}
      </table></div>
      <h2>Property Description and client answers</h2>
      <div class="card"><table class="sum">
        ${row('Property', `${esc(an.pBed || '?')} bed, ${esc(an.pBath || '?')} bath ${esc((an.pType || '').toLowerCase())}, ${esc(an.pFloor || '?')}m² on ${esc(an.pLand || '?')}m², built ${esc(an.pYear || '?')}`)}
        ${row('Construction', [an.pBuild, an.pPark, an.pHeat].filter(Boolean).map(esc).join(' · '))}
        ${row('Chattels', esc((an.chattels || []).join(', ')) + (an.chatOther ? '. ' + esc(an.chatOther) : ''))}
        ${row('Work done', an.work === 'yes' ? esc(an.workDetail) : an.work === 'no' ? 'None known' : 'Not answered yet')}
        ${row('Weathertightness', an.wt === 'yes' ? esc(an.wtDetail) : an.wt === 'no' ? 'No issues known' : 'Not answered yet')}
        ${row('Methamphetamine', an.meth === 'yes' ? esc(an.methDetail) : an.meth === 'no' ? 'None known' : 'Not answered yet')}
        ${row('Defects or notices', an.def === 'yes' ? esc(an.defDetail) : an.def === 'no' ? 'None known' : 'Not answered yet')}
        ${row('Hazards', esc((an.hazards || []).join(', ')) + (an.hazOther ? '. ' + esc(an.hazOther) : ''))}
        ${row('Visiting professionals', `McGuire representative present at every visit; quotes ${an.vQuotes === false ? 'not allowed' : 'allowed'}; sales assessments ${an.vSales ? 'allowed' : 'not allowed'}; ${esc((an.vNotice || 'Same day is fine').toLowerCase())} notice`)}
        ${row('Other agencies', an.prior === 'yes' ? 'Yes: ' + esc(an.priorDetail) : an.prior ? 'None' : 'Not answered yet')}
        ${row('Interested buyers', (an.interested || []).length ? an.interested.map(b => esc(b.name) + (b.exclude ? ' (excluded for 10 working days)' : ' (to be negotiated by the agent)')).join('<br>') : 'None listed')}
      </table></div>
      ${(d.people || []).some(p => p.signed_at) ? `<h2>Signatures</h2><div class="card"><table class="sum">${d.people.filter(p => p.signed_at).map(p => row(esc(p.legal_name), 'Signed ' + esc(fmtDT(p.signed_at)))).join('')}${ag.countersigned_at ? row('Timothy McGuire REA#20117983', 'Countersigned ' + esc(fmtDT(ag.countersigned_at))) : ''}</table></div>` : ''}
      <h2>Standard terms</h2>
      <div class="card"><p style="margin:0">The front page is read together with McGuire Real Estate's standard Terms and Conditions (${esc(ag.agreement_version)}). For a full copy, reply to the email you received or contact Tim McGuire on 027 562 7207 or tim@mcguire.co.nz.</p>
        <p class="small" style="margin:10px 0 0">Real Estate Authority guides: <a href="${REA_AA}" target="_blank" rel="noopener">agency agreements</a> · <a href="${REA_SP}" target="_blank" rel="noopener">sale and purchase agreements</a></p></div>
    </div>`;
    top();
  }

  const lawyerToken = new URLSearchParams(location.search).get('lawyer');
  if (lawyerToken) { viewLawyer(lawyerToken); return; }

  boot().catch(e => { console.error(e); main().innerHTML = `<div class="login-card"><h1>Something went wrong</h1><p class="lede">Please refresh the page. If it keeps happening, call Tim on 027 562 7207.</p></div>`; });
})();

</script>
</body>
</html>
