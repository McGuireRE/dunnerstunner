<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cornerstone Music</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--card:#fff;--line:#e2e0d9;--ink:#141413;--ink2:#55534e;--acc:#1f6f5c;--acc-soft:#e2f1ec;--warn:#a85a00;--warn-soft:#fbefdc;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--card:#1c1c1a;--line:#32312e;--ink:#f1f0ec;--ink2:#b9b7ae;--acc:#5cc2a8;--acc-soft:#1b3630;--warn:#e7a04a;--warn-soft:#3a2a12;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 4px}h3{font-size:14px;margin:14px 0 6px;color:var(--ink2);font-weight:600}
main{max-width:720px;margin:0 auto;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card.mine{border-color:var(--acc)}
.muted{color:var(--ink2);font-size:14px}.small{font-size:13px}
.row{display:flex;gap:8px;padding:3px 0;font-size:15px}.row b{flex:0 0 96px;font-weight:500;color:var(--ink2)}
.me{background:var(--acc-soft);border-radius:6px;padding:0 5px;font-weight:600}
.chip{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:var(--line);color:var(--ink2);margin-left:4px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.acc{background:var(--acc-soft);color:var(--acc)}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){button.pri{color:#0c1f1a}}
button.sm{padding:3px 9px;min-height:30px;font-size:13px}button.link{border:0;background:none;color:var(--acc);padding:4px;min-height:0;text-decoration:underline}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px;min-height:42px}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
nav button{flex:1;max-width:180px;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--ink2)}
nav button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
#toast{position:fixed;left:12px;right:12px;bottom:86px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;text-align:center;z-index:5}
.checks{display:flex;flex-wrap:wrap;gap:6px}.checks label{display:flex;align-items:center;gap:5px;margin:0;border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--ink);font-size:14px}
.checks input{width:auto;min-height:0}
</style>
</head>
<body>
<header><h1>Cornerstone Music</h1><span id="who" class="muted small"></span></header>
<main id="app"><p class="muted">Loading...</p></main>
<nav id="nav" hidden></nav>
<div id="toast"></div>
<script src="../wellbeing/supabase.min.js"></script>
<script>
// One page, no build step. All data lives in the site's own database (project cornerstone-music), never in this file.
const SB_URL='https://cimksrrmmbtauowrywlh.supabase.co', SB_KEY='sb_publishable_r5ciVqRkmhqATRrvkKYWww_tEZO3BJ9';
const DEMO=new URLSearchParams(location.search).has('demo');
const TABLES=['people','person_emails','roles','person_roles','services','slots','away','songs','service_songs','swaps','app_settings'];
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Pacific/Auckland'});
const dstr=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const days=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
let S={}, me=[], view='roster', edit=null, songSvc=null, q='', sb=null, session=null, busy=false;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

// ---------- data layer: the real database, or a made-up team for the demo ----------
const real={
  async load(){const r=await Promise.all(TABLES.map(t=>sb.from(t).select('*')));const o={};
    r.forEach((x,i)=>{if(x.error)throw x.error;o[TABLES[i]]=x.data});const m=await sb.rpc('me_ids');if(m.error)throw m.error;return [o,m.data||[]]},
  async ins(t,row){const r=await sb.from(t).insert(row).select();if(r.error)throw r.error;return r.data[0]},
  async upd(t,match,patch){const r=await sb.from(t).update(patch).match(match);if(r.error)throw r.error},
  async del(t,match){const r=await sb.from(t).delete().match(match);if(r.error)throw r.error},
  async rpc(n,a){const r=await sb.rpc(n,a);if(r.error)throw r.error;return r.data}};
let D=null, demoAs='p1';
const uid=()=>'x'+Math.random().toString(36).slice(2,10);
function demoData(){const t=today(), sun=n=>{const d=new Date(t+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+((7-d.getUTCDay())%7)+7*n);return d.toISOString().slice(0,10)};
  const P=[['p1','Alex (you)','webmaster'],['p2','Bea','admin'],['p3','Cam','member'],['p4','Dee','member'],['p5','Eli','member'],['p6','Fern','member']];
  const R=[['lead','Lead',1],['chooser','Song chooser',2],['sound','Sound',3],['slides','Slides',4],['mic1','Mic 1',5],['mic2','Mic 2',6],['guitar','Guitar',8],['piano','Piano',9],['drums','Drums',10],['speaker','Speaker',13],['service_lead','Service lead',14]];
  const G=[['g1','Morning Light','D','modern'],['g2','Old Hundredth','G','old'],['g3','River Song','A','modern'],['g4','Abide','Eb','old'],['g5','Steadfast','C','modern'],['g6','Harvest Hymn','F','old'],['g7','New Mercies','E','modern']];
  const sv=[-3,-2,-1,0,1,2].map((n,i)=>({id:'s'+i,date:sun(n),kind:'sunday',title:null,passage:n>=0?'Psalm '+(23+n):null,notes:n==1?'School holidays':null,songs_confirmed_at:null}));
  sv.push({id:'s9',date:sun(3).replace(/..$/,x=>x),kind:'special',title:'Carols evening',passage:null,notes:null,songs_confirmed_at:null});
  const sl=[];const put=(s,r,p)=>sl.push({id:uid(),service_id:s,role_id:r,person_id:p});
  put('s3','lead','p3');put('s3','mic1','p3');put('s3','mic2','p1');put('s3','guitar','p4');put('s3','piano','p5');put('s3','sound','p6');put('s3','speaker','p2');
  put('s4','lead','p1');put('s4','mic1','p1');put('s4','guitar','p3');put('s4','piano','p5');put('s4','drums','p4');
  put('s5','lead','p4');put('s5','piano','p5');
  const pk=[];const pick=(s,g,i,b=1)=>pk.push({id:uid(),service_id:s,song_id:g,position:i,bracket:b,key:null});
  pick('s0','g1',1);pick('s0','g2',2);pick('s1','g3',1);pick('s1','g4',2);pick('s2','g1',1);pick('s2','g6',2);pick('s3','g5',1);pick('s3','g7',2);pick('s3','g4',1,2);
  const pr=[];P.forEach(p=>['mic1','mic2'].forEach(r=>pr.push({person_id:p[0],role_id:r})));[['p3','lead'],['p1','lead'],['p4','lead'],['p3','guitar'],['p4','guitar'],['p6','guitar'],['p5','piano'],['p4','drums'],['p6','sound']].forEach(x=>pr.push({person_id:x[0],role_id:x[1]}));
  return {people:P.map(p=>({id:p[0],name:p[1],level:p[2],active:true,phone:null,left_on:null})),person_emails:P.map(p=>({email:p[0]+'@example.com',person_id:p[0]})),
    roles:R.map(r=>({id:r[0],label:r[1],sort:r[2]})),person_roles:pr,services:sv,slots:sl,away:[{id:'a1',person_id:'p6',from_date:sun(1),to_date:sun(1),note:'Camping'}],
    songs:G.map(g=>({id:g[0],title:g[1],key:g[2],era:g[3],preferred:true,sheet_url:null,active:true})),service_songs:pk,
    swaps:[{id:'w1',slot_id:sl[3].id,requested_by:'p4',note:'Working that weekend',status:'open',covered_by:null,created_at:new Date().toISOString()}],app_settings:[]}}
const demo={
  async load(){D=D||demoData();return [JSON.parse(JSON.stringify(D)),[demoAs]]},
  async ins(t,row){const r={id:uid(),...row};D[t].push(r);return r},
  async upd(t,m,p){D[t].filter(r=>Object.keys(m).every(k=>r[k]===m[k])).forEach(r=>Object.assign(r,p))},
  async del(t,m){D[t]=D[t].filter(r=>!Object.keys(m).every(k=>r[k]===m[k]))},
  async rpc(n,a){
    if(n=='request_cover'){const s=D.slots.find(x=>x.id==a.p_slot);D.swaps.push({id:uid(),slot_id:s.id,requested_by:s.person_id,note:a.p_note,status:'open',created_at:new Date().toISOString()})}
    if(n=='take_cover'){const w=D.swaps.find(x=>x.id==a.p_swap);if(w.status!='open')throw new Error('Someone has already covered this');D.slots.find(x=>x.id==w.slot_id).person_id=a.p_as||demoAs;w.status='covered';w.covered_by=a.p_as||demoAs}
    if(n=='cancel_cover')D.swaps.find(x=>x.id==a.p_swap).status='cancelled';
    if(n=='confirm_songs')D.services.find(x=>x.id==a.p_service).songs_confirmed_at=new Date().toISOString()}};
const api=DEMO?demo:real;

// ---------- helpers over the loaded data ----------
const P=id=>S.people.find(p=>p.id==id)||{name:'?'};
const myPeople=()=>S.people.filter(p=>me.includes(p.id));
const isAdmin=()=>myPeople().some(p=>p.level!='member'), isWeb=()=>myPeople().some(p=>p.level=='webmaster');
const svSlots=id=>S.slots.filter(s=>s.service_id==id);
const canPick=id=>isAdmin()||svSlots(id).some(s=>['lead','chooser'].includes(s.role_id)&&me.includes(s.person_id));
const upcoming=()=>S.services.filter(s=>s.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));
const picks=id=>S.service_songs.filter(x=>x.service_id==id).sort((a,b)=>a.bracket-b.bracket||a.position-b.position);
const isAway=(pid,date)=>S.away.some(a=>a.person_id==pid&&a.from_date<=date&&a.to_date>=date);
function lastSung(songId,before){let best=null;for(const x of S.service_songs){if(x.song_id!=songId)continue;const sv=S.services.find(s=>s.id==x.service_id);if(sv&&sv.date<before&&(!best||sv.date>best))best=sv.date}return best}
function ago(d,ref){if(!d)return 'not sung lately';const n=days(d,ref);if(n<=0)return 'on this date';if(n<11)return n+' days before';const w=Math.round(n/7);return w+' weeks before'}

async function refresh(){try{[S,me]=await api.load();render()}catch(e){app.innerHTML='<div class="card"><p>Could not load the roster.</p><p class="muted">'+esc(e.message||e)+'</p></div>'}}
async function act(fn,msg){if(busy)return;busy=true;try{await fn();if(msg)toast(msg)}catch(e){toast(e.message||String(e))}busy=false;await refresh()}

// ---------- screens ----------
function render(){
  if(!DEMO&&!session)return renderSignIn();
  $('#who').innerHTML=DEMO?'Demo, made-up people':esc(myPeople().map(p=>p.name).join(' and '))+' <button class="link small" data-a="signout">Sign out</button>';
  if(!me.length){$('#nav').hidden=true;app.innerHTML='<div class="card"><h2>Not on the team list yet</h2><p>You are signed in, but this email address is not on the music team list. Ask one of the music admins to add you.</p></div>';return}
  const tabs=[['roster','Roster'],['songs','Songs'],['away','Away'],['people','People']];
  $('#nav').hidden=false;$('#nav').innerHTML=tabs.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${view==t[0]?'on':''}">${t[1]}</button>`).join('');
  const demoBar=DEMO?`<div class="note">This is a demo with made-up people. Nothing here is saved. View as <select data-c="demoas" style="width:auto;min-height:0;padding:3px">${S.people.map(p=>`<option value="${p.id}" ${p.id==demoAs?'selected':''}>${esc(p.name)} (${p.level})</option>`).join('')}</select></div>`:'';
  app.innerHTML=demoBar+({roster:vRoster,songs:vSongs,away:vAway,people:vPeople}[view])();
}
function renderSignIn(){$('#nav').hidden=true;$('#who').textContent='';
  const t=new URLSearchParams(location.search).get('t');
  app.innerHTML=t?`<div class="card"><h2>Nearly there</h2><p>Tap the button to finish signing in.</p><div class="bar"><button class="pri" data-a="verify" data-t="${esc(t)}">Sign me in</button></div></div>`
  :`<div class="card"><h2>Sign in</h2><p class="muted">Enter the email address the music team has for you and we will send you a sign-in link. No password needed.</p>
   <label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email"><div class="bar"><button class="pri" data-a="signin">Email me a link</button></div><p id="sim" class="muted"></p></div>`}

function namesFor(sv,role){return svSlots(sv.id).filter(s=>s.role_id==role.id).map(s=>{const w=S.swaps.find(x=>x.slot_id==s.id&&x.status=='open');
  return `<span class="${me.includes(s.person_id)?'me':''}">${esc(P(s.person_id).name)}</span>${w?'<span class="chip warn">needs cover</span>':''}${isAway(s.person_id,sv.date)?'<span class="chip warn">away</span>':''}`}).join(', ')}
function vRoster(){
  if(edit)return vEdit(S.services.find(s=>s.id==edit));
  const roles=[...S.roles].sort((a,b)=>a.sort-b.sort);
  const cards=upcoming().map(sv=>{const mine=svSlots(sv.id).filter(s=>me.includes(s.person_id));const pk=picks(sv.id);
    const rows=roles.map(r=>{const n=namesFor(sv,r);return n?`<div class="row"><b>${esc(r.label)}</b><span>${n}</span></div>`:''}).join('');
    const swaps=S.swaps.filter(w=>w.status=='open'&&svSlots(sv.id).some(s=>s.id==w.slot_id)).map(w=>{const s=S.slots.find(x=>x.id==w.slot_id),r=S.roles.find(x=>x.id==s.role_id),own=me.includes(w.requested_by);
      return `<div class="note">${esc(P(w.requested_by).name)} needs cover for ${esc(r.label)}${w.note?': '+esc(w.note):''}<div class="bar">${own?'':myPeople().map(p=>`<button class="sm pri" data-a="take" data-id="${w.id}" data-as="${p.id}">I'll cover it${me.length>1?' ('+esc(p.name)+')':''}</button>`).join('')}${own||isAdmin()?`<button class="sm" data-a="cancelcover" data-id="${w.id}">${own?'I can make it after all':'Cancel request'}</button>`:''}</div></div>`}).join('');
    const mineBtns=mine.filter(s=>!S.swaps.some(w=>w.slot_id==s.id&&w.status=='open')).map(s=>`<button class="sm" data-a="cant" data-id="${s.id}">I can't make ${esc(S.roles.find(r=>r.id==s.role_id).label)}${me.length>1?' ('+esc(P(s.person_id).name)+')':''}</button>`).join('');
    return `<div class="card ${mine.length?'mine':''}"><h2>${dstr(sv.date)}${sv.kind=='special'?'<span class="chip acc">Special event</span>':''}${mine.length?'<span class="chip acc">You\'re on</span>':''}</h2>
      <div class="muted">${[sv.title,sv.passage].filter(Boolean).map(esc).join(' · ')}</div>${sv.notes?`<div class="muted small">${esc(sv.notes)}</div>`:''}
      ${rows||'<p class="muted">Nobody rostered yet.</p>'}${swaps}
      <h3>Songs ${sv.songs_confirmed_at?'<span class="chip acc">confirmed</span>':pk.length?'<span class="chip warn">not confirmed yet</span>':''}</h3>
      ${pk.length?'<div class="small">'+pk.map(x=>esc((S.songs.find(g=>g.id==x.song_id)||{}).title)).join(' · ')+'</div>':'<div class="muted small">Not chosen yet.</div>'}
      <div class="bar">${mineBtns}${canPick(sv.id)?`<button class="sm" data-a="choose" data-id="${sv.id}">Choose songs</button>`:''}${isAdmin()?`<button class="sm" data-a="edit" data-id="${sv.id}">Edit roster</button>`:''}</div></div>`}).join('');
  return (isAdmin()?`<div class="bar"><button data-a="newsv" data-k="sunday">Add a Sunday</button><button data-a="newsv" data-k="special">Add a special event</button></div>`:'')+(cards||'<p class="muted">No services coming up.</p>')}
function vEdit(sv){const roles=[...S.roles].sort((a,b)=>a.sort-b.sort), act_=S.people.filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name));
  const rows=roles.map(r=>{const on=svSlots(sv.id).filter(s=>s.role_id==r.id);const can=id=>S.person_roles.some(x=>x.person_id==id&&x.role_id==r.id);
    const opts=[...act_.filter(p=>can(p.id)),...act_.filter(p=>!can(p.id))].filter(p=>!on.some(s=>s.person_id==p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}${can(p.id)?'':' (not usual)'}${isAway(p.id,sv.date)?' (away)':''}</option>`).join('');
    return `<div class="line"><div style="flex:1"><b>${esc(r.label)}</b> ${on.map(s=>`<span class="chip">${esc(P(s.person_id).name)} <button class="link small" data-a="unslot" data-id="${s.id}" aria-label="Remove">remove</button></span>`).join('')}</div>
      <select data-c="slot" data-sv="${sv.id}" data-role="${r.id}" style="width:130px"><option value="">Add...</option>${opts}</select></div>`}).join('');
  return `<div class="card"><h2>${dstr(sv.date)}</h2>
    <label>Date</label><input type="date" data-c="svf" data-f="date" value="${sv.date}">
    <label>Title (for special events)</label><input data-c="svf" data-f="title" value="${esc(sv.title)}">
    <label>Passage</label><input data-c="svf" data-f="passage" value="${esc(sv.passage)}">
    <label>Notes</label><input data-c="svf" data-f="notes" value="${esc(sv.notes)}">
    <h3>Who's on</h3>${rows}
    <div class="bar"><button class="pri" data-a="doneedit">Done</button><button data-a="delsv" data-id="${sv.id}">Delete this date</button></div></div>`}

function vSongs(){const up=upcoming();if(!up.length)return '<p class="muted">No services coming up.</p>';
  if(!songSvc||!up.some(s=>s.id==songSvc))songSvc=(up.find(s=>svSlots(s.id).some(x=>x.role_id=='lead'&&me.includes(x.person_id)))||up[0]).id;
  const sv=up.find(s=>s.id==songSvc), can=canPick(sv.id), pk=picks(sv.id), G=id=>S.songs.find(g=>g.id==id)||{};
  const mix={modern:0,old:0,none:0};pk.forEach(x=>mix[G(x.song_id).era||'none']++);
  const item=(x,i)=>{const g=G(x.song_id),ls=lastSung(g.id,sv.date),soon=ls&&days(ls,sv.date)<29;
    return `<div class="line"><div><b>${esc(g.title)}</b> <span class="muted small">${esc(x.key||g.key||'')}</span>${g.era?`<span class="chip">${g.era}</span>`:''}${soon?`<span class="chip warn">sung ${ago(ls,sv.date)}</span>`:''}${g.sheet_url?` <a class="small" href="${esc(g.sheet_url)}" target="_blank" rel="noopener">music</a>`:''}</div>
      ${can?`<div style="white-space:nowrap"><button class="sm" data-a="mv" data-id="${x.id}" data-d="-1" aria-label="Move up">↑</button> <button class="sm" data-a="mv" data-id="${x.id}" data-d="1" aria-label="Move down">↓</button> <button class="sm" data-a="br" data-id="${x.id}">${x.bracket==1?'After break':'Before break'}</button> <button class="sm" data-a="unpick" data-id="${x.id}" aria-label="Remove">✕</button></div>`:''}</div>`};
  const b1=pk.filter(x=>x.bracket==1), b2=pk.filter(x=>x.bracket!=1);
  const chosen=pk.length?`<h3>First bracket</h3>${b1.map(item).join('')||'<p class="muted small">None yet.</p>'}<h3>After the break</h3>${b2.map(item).join('')||'<p class="muted small">None yet.</p>'}
    <p class="small muted">Mix: ${mix.modern} modern, ${mix.old} old${mix.none?', '+mix.none+' untagged':''}</p>`:'<p class="muted">No songs chosen yet.</p>';
  const folder=(S.app_settings.find(x=>x.key=='music_folder_url')||{}).value;
  const taken=new Set(pk.map(x=>x.song_id)), ql=q.toLowerCase();
  const list=S.songs.filter(g=>g.active&&!taken.has(g.id)&&(!ql||g.title.toLowerCase().includes(ql))).map(g=>({g,ls:lastSung(g.id,sv.date)}))
    .sort((a,b)=>(b.g.preferred-a.g.preferred)||((a.ls||'')).localeCompare(b.ls||'')||a.g.title.localeCompare(b.g.title))
    .map(({g,ls})=>{const soon=ls&&days(ls,sv.date)<29;return `<div class="line"><div><b>${esc(g.title)}</b> <span class="muted small">${esc(g.key||'')}</span>${g.era?`<span class="chip">${g.era}</span>`:''}${g.preferred?'':'<span class="chip">not on preferred list</span>'}<div class="small ${soon?'':'muted'}">${soon?'<span class="chip warn" style="margin-left:0">':''}${ls?'Last sung '+dstr(ls)+', '+ago(ls,sv.date):'Not sung lately'}${soon?'</span>':''}</div></div>
      <div style="white-space:nowrap">${can?`<button class="sm pri" data-a="pick" data-id="${g.id}">Add</button>`:''}${isAdmin()?` <button class="sm" data-a="editsong" data-id="${g.id}">Edit</button>`:''}</div></div>`}).join('');
  return `<div class="card"><label>Songs for</label><select data-c="songsvc">${up.map(s=>`<option value="${s.id}" ${s.id==sv.id?'selected':''}>${dstr(s.date)}${s.title?' · '+esc(s.title):''}</option>`).join('')}</select>
    ${sv.passage?`<p class="muted small">${esc(sv.passage)}</p>`:''}${chosen}
    ${can?`<div class="bar"><button class="pri" data-a="confirm" data-id="${sv.id}" ${pk.length?'':'disabled'}>${sv.songs_confirmed_at?'Confirm again and re-send':'Confirm and send to the team'}</button></div>${sv.songs_confirmed_at?'<p class="muted small">Confirmed. Change anything and confirm again to send an updated list.</p>':''}`:'<p class="muted small">Only that day\'s song leader or an admin can change these.</p>'}
    ${folder?`<p class="small"><a href="${esc(folder)}" target="_blank" rel="noopener">Open the music folder</a></p>`:''}</div>
    <div class="card"><h2>Song list</h2><p class="muted small">Least recently sung first. Any song can be used; the preferred list is a guide.</p>
    <input placeholder="Search songs" data-c="q" value="${esc(q)}">${list||'<p class="muted">No songs match.</p>'}
    ${can?`<div class="bar"><button data-a="newsong">Add a song that isn't listed</button></div>`:''}</div>`}

function vAway(){const t=today(), who=myPeople();
  const mine=S.away.filter(a=>me.includes(a.person_id)&&a.to_date>=t).sort((a,b)=>a.from_date.localeCompare(b.from_date));
  const others=S.away.filter(a=>!me.includes(a.person_id)&&a.to_date>=t).sort((a,b)=>a.from_date.localeCompare(b.from_date));
  const li=(a,del)=>`<div class="line"><div><b>${esc(P(a.person_id).name)}</b> ${dstr(a.from_date)}${a.to_date!=a.from_date?' to '+dstr(a.to_date):''}${a.note?`<div class="muted small">${esc(a.note)}</div>`:''}</div>${del?`<button class="sm" data-a="delaway" data-id="${a.id}">Remove</button>`:''}</div>`;
  return `<div class="card"><h2>When I'm away</h2><p class="muted small">Add dates you can't do so you aren't rostered on. No reason needed.</p>${mine.map(a=>li(a,true)).join('')||'<p class="muted">No away dates.</p>'}
    ${who.length>1||isAdmin()?`<label>Who</label><select id="aw">${(isAdmin()?S.people.filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name)):who).map(p=>`<option value="${p.id}" ${p.id==me[0]?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}
    <label>From</label><input type="date" id="af" min="${t}"><label>To (leave blank for one day)</label><input type="date" id="at" min="${t}"><label>Note (optional)</label><input id="an">
    <div class="bar"><button class="pri" data-a="addaway">Add away dates</button></div></div>
    <div class="card"><h2>Others away</h2>${others.map(a=>li(a,isAdmin())).join('')||'<p class="muted">Nobody else has away dates coming up.</p>'}</div>`}

function vPeople(){const ppl=[...S.people].sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name));
  if(edit&&edit.p)return vPerson(edit.p=='new'?{id:'new',name:'',level:'member',active:true}:S.people.find(p=>p.id==edit.p));
  const folder=(S.app_settings.find(x=>x.key=='music_folder_url')||{}).value||'';
  return (isAdmin()?`<div class="bar"><button class="pri" data-a="person" data-id="new">Add a person</button></div>`:'')+`<div class="card">${ppl.map(p=>{const em=S.person_emails.filter(e=>e.person_id==p.id).map(e=>e.email);
    const rl=S.person_roles.filter(x=>x.person_id==p.id).map(x=>(S.roles.find(r=>r.id==x.role_id)||{}).label).filter(Boolean).join(', ');
    return `<div class="line"><div style="min-width:0"><b>${esc(p.name)}</b>${p.level!='member'?`<span class="chip acc">${p.level}</span>`:''}${p.active?'':'<span class="chip">left</span>'}${em.length?'':'<span class="chip warn">no login</span>'}
      <div class="muted small" style="overflow-wrap:anywhere">${em.map(e=>`<a href="mailto:${esc(e)}">${esc(e)}</a>`).join(', ')}${p.phone?' · '+esc(p.phone):''}</div><div class="muted small">${esc(rl)}</div></div>
      ${isAdmin()&&(p.level!='webmaster'||isWeb())?`<button class="sm" data-a="person" data-id="${p.id}">Edit</button>`:''}</div>`}).join('')}</div>`
    +(isAdmin()?`<div class="card"><h2>Music folder</h2><p class="muted small">The link to the team's music folder. It goes in the song list email.</p><input id="mf" value="${esc(folder)}" placeholder="https://drive.google.com/..."><div class="bar"><button data-a="savefolder">Save link</button></div></div>`:'')}
function vPerson(p){const isNew=p.id=='new', em=isNew?[]:S.person_emails.filter(e=>e.person_id==p.id).map(e=>e.email), has=r=>!isNew&&S.person_roles.some(x=>x.person_id==p.id&&x.role_id==r);
  return `<div class="card"><h2>${isNew?'Add a person':esc(p.name)}</h2>
    <label>Name</label><input id="pn" value="${esc(p.name)}"><label>Email (their login). Separate two addresses with a comma.</label><input id="pe" value="${esc(em.join(', '))}" inputmode="email">
    <label>Phone (optional)</label><input id="pp" value="${esc(p.phone)}">
    <label>What they can do</label><div class="checks">${[...S.roles].sort((a,b)=>a.sort-b.sort).map(r=>`<label><input type="checkbox" class="pr" value="${r.id}" ${has(r.id)?'checked':''}>${esc(r.label)}</label>`).join('')}</div>
    <label>Access</label><select id="pl"><option value="member" ${p.level=='member'?'selected':''}>Team member</option><option value="admin" ${p.level=='admin'?'selected':''}>Admin (runs the roster and people)</option>${isWeb()?`<option value="webmaster" ${p.level=='webmaster'?'selected':''}>Webmaster</option>`:''}</select>
    ${isNew?'':`<label>On the team</label><select id="pa"><option value="1" ${p.active?'selected':''}>Yes</option><option value="0" ${p.active?'':'selected'}>Has left (login off, history kept)</option></select>`}
    <div class="bar"><button class="pri" data-a="saveperson" data-id="${p.id}">Save</button><button data-a="cancelperson">Cancel</button></div></div>`}

// ---------- actions ----------
async function renumber(svId,list){let i={1:0,2:0};for(const x of list){const pos=++i[x.bracket==1?1:2];if(x.position!=pos)await api.upd('service_songs',{id:x.id},{position:pos})}}
const A={
  tab(e){view=e.dataset.v;edit=null;render()},
  async signout(){await sb.auth.signOut();session=null;render()},
  async signin(){const em=$('#em').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em)){$('#sim').textContent='Enter your email address first.';return}
    $('#sim').textContent='Sending...';try{const r=await fetch(SB_URL+'/functions/v1/music-mail',{method:'POST',headers:{'content-type':'application/json',apikey:SB_KEY},body:JSON.stringify({action:'signin',email:em})});
      const j=await r.json().catch(()=>({}));$('#sim').textContent=j.message||'If that address is on the team list, a sign-in link is on its way. It can take a minute.'}catch(x){$('#sim').textContent='Could not send just now. Try again shortly.'}},
  async verify(e){const r=await sb.auth.verifyOtp({token_hash:e.dataset.t,type:'magiclink'});history.replaceState(null,'',location.pathname);
    if(r.error){toast('That link has expired or was already used. Ask for a new one.');render();return}session=r.data.session;refresh()},
  cant(e){const n=prompt('Add a note for the team if you like (optional):','');if(n===null)return;act(()=>api.rpc('request_cover',{p_slot:e.dataset.id,p_note:n}),'Thanks. The team has been asked for cover.')},
  take(e){act(()=>api.rpc('take_cover',{p_swap:e.dataset.id,p_as:e.dataset.as}),'You\'re on. Thank you!')},
  cancelcover(e){act(()=>api.rpc('cancel_cover',{p_swap:e.dataset.id}),'Request cancelled.')},
  choose(e){songSvc=e.dataset.id;view='songs';q='';render();scrollTo(0,0)},
  edit(e){edit=e.dataset.id;render();scrollTo(0,0)}, doneedit(){edit=null;render()},
  newsv(e){const up=S.services.filter(s=>s.kind=='sunday').map(s=>s.date).sort().pop()||today();const d=new Date(up+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+7);
    const date=e.dataset.k=='sunday'?d.toISOString().slice(0,10):today();act(async()=>{const r=await api.ins('services',{date,kind:e.dataset.k,title:e.dataset.k=='special'?'Special event':null});edit=r.id})},
  delsv(e){if(confirm('Delete this date and everyone rostered on it?'))act(async()=>{await api.del('services',{id:e.dataset.id});edit=null},'Deleted.')},
  unslot(e){act(()=>api.del('slots',{id:e.dataset.id}))},
  pick(e){const pk=picks(songSvc);const br=pk.filter(x=>x.bracket==1).length>=4?2:1;act(async()=>{await api.ins('service_songs',{service_id:songSvc,song_id:e.dataset.id,bracket:br,position:pk.filter(x=>(x.bracket==1?1:2)==br).length+1})})},
  unpick(e){act(async()=>{await api.del('service_songs',{id:e.dataset.id});await renumber(songSvc,picks(songSvc).filter(x=>x.id!=e.dataset.id))})},
  mv(e){const x=S.service_songs.find(r=>r.id==e.dataset.id),grp=picks(songSvc).filter(r=>(r.bracket==1)==(x.bracket==1)),i=grp.indexOf(x),j=i+ +e.dataset.d;if(j<0||j>=grp.length)return;
    act(async()=>{await api.upd('service_songs',{id:x.id},{position:grp[j].position});await api.upd('service_songs',{id:grp[j].id},{position:x.position})})},
  br(e){const x=S.service_songs.find(r=>r.id==e.dataset.id),nb=x.bracket==1?2:1;act(()=>api.upd('service_songs',{id:x.id},{bracket:nb,position:picks(songSvc).filter(r=>(r.bracket==1?1:2)==nb).length+1}))},
  confirm(e){act(()=>api.rpc('confirm_songs',{p_service:e.dataset.id}),'Songs confirmed.')},
  newsong(){const t=(prompt('Song title:')||'').trim();if(!t)return;const k=(prompt('Key (optional):')||'').trim()||null;
    act(async()=>{const g=await api.ins('songs',{title:t,key:k,preferred:false});await api.ins('service_songs',{service_id:songSvc,song_id:g.id,bracket:1,position:picks(songSvc).filter(x=>x.bracket==1).length+1})},'Song added.')},
  editsong(e){const g=S.songs.find(x=>x.id==e.dataset.id);const k=prompt('Key for "'+g.title+'":',g.key||'');if(k===null)return;
    const era=prompt('Modern or old? Type modern, old, or leave blank:',g.era||'');if(era===null)return;const url=prompt('Link to the music (optional):',g.sheet_url||'');if(url===null)return;
    const pref=confirm('Keep this song on the preferred list? OK for yes, Cancel for no.');const er=era.trim().toLowerCase();
    act(()=>api.upd('songs',{id:g.id},{key:k.trim()||null,era:['modern','old'].includes(er)?er:null,sheet_url:url.trim()||null,preferred:pref}),'Song updated.')},
  addaway(){const f=$('#af').value,t=$('#at').value||f,pid=($('#aw')||{}).value||me[0];if(!f){toast('Choose a date first.');return}if(t<f){toast('The end date is before the start date.');return}
    act(()=>api.ins('away',{person_id:pid,from_date:f,to_date:t,note:$('#an').value.trim()||null}),'Away dates added.')},
  delaway(e){act(()=>api.del('away',{id:e.dataset.id}))},
  person(e){edit={p:e.dataset.id};render();scrollTo(0,0)}, cancelperson(){edit=null;render()},
  saveperson(e){const id=e.dataset.id,name=$('#pn').value.trim(),emails=[...new Set($('#pe').value.toLowerCase().split(/[,\s]+/).filter(Boolean))],roles=[...document.querySelectorAll('.pr:checked')].map(c=>c.value);
    if(!name){toast('Add a name first.');return}if(emails.some(x=>!/^\S+@\S+\.\S+$/.test(x))){toast('One of those email addresses does not look right.');return}
    const active=$('#pa')?$('#pa').value=='1':true, row={name,phone:$('#pp').value.trim()||null,level:$('#pl').value,active,left_on:active?null:today()};
    act(async()=>{let pid=id;if(id=='new')pid=(await api.ins('people',row)).id;else await api.upd('people',{id},row);
      const oe=S.person_emails.filter(x=>x.person_id==pid).map(x=>x.email);for(const x of oe)if(!emails.includes(x))await api.del('person_emails',{email:x,person_id:pid});
      for(const x of emails)if(!oe.includes(x))await api.ins('person_emails',{email:x,person_id:pid});
      const or=S.person_roles.filter(x=>x.person_id==pid).map(x=>x.role_id);for(const x of or)if(!roles.includes(x))await api.del('person_roles',{person_id:pid,role_id:x});
      for(const x of roles)if(!or.includes(x))await api.ins('person_roles',{person_id:pid,role_id:x});edit=null},'Saved.')},
  savefolder(){const v=$('#mf').value.trim();if(v&&!/^https:\/\//.test(v)){toast('The link should start with https://');return}
    act(async()=>{if(S.app_settings.some(x=>x.key=='music_folder_url'))await api.upd('app_settings',{key:'music_folder_url'},{value:v||null});else await api.ins('app_settings',{key:'music_folder_url',value:v||null})},'Link saved.')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b)}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;
  if(c=='demoas'){demoAs=e.target.value;edit=null;refresh()}
  if(c=='songsvc'){songSvc=e.target.value;render()}
  if(c=='slot'&&e.target.value)act(()=>api.ins('slots',{service_id:e.target.dataset.sv,role_id:e.target.dataset.role,person_id:e.target.value}));
  if(c=='svf'){const v=e.target.value.trim();if(e.target.dataset.f=='date'&&!v)return;act(()=>api.upd('services',{id:edit},{[e.target.dataset.f]:v||null}))}});
document.addEventListener('input',e=>{if(e.target.dataset.c=='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=document.querySelector('[data-c=q]');n.focus();n.setSelectionRange(p,p)}});

(async()=>{if(DEMO)return refresh();
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  session=(await sb.auth.getSession()).data.session;if(session)refresh();else render()})();
</script>
</body>
</html>
