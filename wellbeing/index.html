<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a1a19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Wellbeing</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f1;--card:#fcfcfb;--line:#e4e2dc;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8984;
  --accent:#2a78d6;--accent-soft:#e3eefb;--avg:#eb6834;--good:#1a7f37;--good-soft:#e3f3e7;--warn:#b35c00;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211;--card:#1a1a19;--line:#2e2d2b;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8d8c85;
    --accent:#3987e5;--accent-soft:#1c2b3f;--avg:#d95926;--good:#3fb35a;--good-soft:#173322;--warn:#e39a43;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211;--card:#1a1a19;--line:#2e2d2b;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8d8c85;
  --accent:#3987e5;--accent-soft:#1c2b3f;--avg:#d95926;--good:#3fb35a;--good-soft:#173322;--warn:#e39a43;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.datebar{display:flex;align-items:center;gap:6px}
.datebar button{width:34px;height:34px}
.datelabel{font-weight:600;min-width:118px;text-align:center;font-size:14px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.group{margin-top:6px}
.group-name{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:10px 0 4px}
.habit{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.group .habit:first-of-type{border-top:none}
.check{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:#fff;font-size:16px}
.check.on{background:var(--good);border-color:var(--good)}
.habit .txt{flex:1;min-width:0}
.habit .cue{font-size:12px;color:var(--ink3)}
.habit .name{font-weight:600}
.streak{font-size:12px;color:var(--ink2);white-space:nowrap;padding-top:4px}
.reading{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.reading:first-of-type{border-top:none}
.reading .lbl{font-size:12px;color:var(--ink3);width:62px;flex:0 0 62px}
.reading a{color:var(--accent);font-weight:600;text-decoration:none;flex:1}
.reading a:after{content:" ▸";font-size:12px}
input[type=number],input[type=time],input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
input[type=number]{width:96px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 10px;background:transparent;color:var(--ink2);font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.chartbox{position:relative;margin-top:6px}
.chartbox svg{display:block;width:100%;height:230px;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;display:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wd{text-align:center;font-size:11px;color:var(--ink3)}
.wd .dots{display:flex;justify-content:center;gap:3px;margin-top:3px;height:10px}
.wd .dots i{width:9px;height:9px;border-radius:50%;display:block}
.wd.today{color:var(--ink);font-weight:700}
.target{display:flex;align-items:center;gap:10px;margin:6px 0}
.target .bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.target .bar i{display:block;height:100%;border-radius:4px}
.grid{overflow-x:auto}
.grid table{border-collapse:separate;border-spacing:3px;font-size:12px}
.grid td.n{color:var(--ink2);white-space:nowrap;padding-right:6px;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.grid td.c{width:16px;height:16px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.grid td.c.on{background:var(--good);border-color:var(--good)}
.grid th{font-weight:400;color:var(--ink3);font-size:10px}
.edit-row{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.edit-row input[type=text]{flex:1;min-width:0}
.edit-row select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.fastbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fastbox label{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}
.sync{font-size:12px;color:var(--ink3);margin:-6px 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.signin input{width:100%;margin:6px 0}
.ok{color:var(--good);font-weight:600}.late{color:var(--warn);font-weight:600}
details summary{cursor:pointer;color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wellbeing</h1>
    <div class="datebar">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="datelabel" id="dlabel"></div>
      <button id="next" aria-label="Next day">›</button>
    </div>
  </header>
  <div class="sync"><span id="syncstate">Saved on this device</span><span><button class="ghost small" id="installbtn" style="display:none">Install app</button><button class="ghost small" id="acctbtn"></button></span></div>
  <div id="signin" class="card signin" style="display:none"></div>
  <div id="status" class="note" style="display:none"></div>
  <div id="app"></div>
</div>
<div class="tip" id="tip"></div>
<script src="supabase.min.js"></script>
<script>
/* ---------- Bible data ---------- */
const OT=[["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Ecclesiastes",12],["Song of Songs",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4]];
const NT=[["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
function flat(list){const a=[];list.forEach(([b,n])=>{for(let c=1;c<=n;c++)a.push(b+" "+c)});return a}
const OTC=flat(OT), NTC=flat(NT);
const ytm=ch=>"https://music.youtube.com/search?q="+encodeURIComponent("Streetlights "+ch);

/* ---------- Defaults ---------- */
const DEFAULT_CFG={
  goalKg:null, otNext:0, ntNext:0,
  groups:["Morning","Eating","Movement","Evening"],
  habits:[
    {id:"sunrise",name:"Watch the sunrise",group:"Morning",cue:"When I wake up"},
    {id:"swim",name:"Swim",group:"Morning"},
    {id:"quiet",name:"Quiet time",group:"Morning"},
    {id:"bible",name:"Audio Bible (4 readings)",group:"Morning",type:"bible"},
    {id:"fasted",name:"Fasted until first meal",group:"Eating",cue:"When I get hungry in the morning"},
    {id:"hflc",name:"Semi-carnivore / HFLC meals",group:"Eating"},
    {id:"kitchen",name:"Finished eating by 1pm",group:"Eating",type:"window"},
    {id:"walk",name:"Long low-intensity movement",group:"Movement",cue:"After lunch"}
  ]
};

/* ---------- Dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=()=>ymd(new Date());
const doy=s=>{const d=parse(s);return Math.round((d-new Date(d.getFullYear(),0,1))/864e5)+1};
const fmtLong=s=>parse(s).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"});
const fmtShort=s=>parse(s).toLocaleDateString("en-NZ",{day:"numeric",month:"short"});
const mondayOf=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};

/* ---------- State ---------- */
let cfg=JSON.parse(JSON.stringify(DEFAULT_CFG));
let days={};            // date -> body
let view=TODAY();
let range=90;
let editing=false;
let openedOn=TODAY();

/* ---------- Storage: this device first, then synced to your account ---------- */
const SB_URL='https://hwpwyjxhdvlqrjwzxzqz.supabase.co';
const SB_KEY='sb_publishable_luFnpeEPhaXWotpQiwVcVw_Yhkii6-1';
const LS='wellbeing-cache-v1';
let store={docs:{},pending:[]};
try{const raw=localStorage.getItem(LS);if(raw)store=Object.assign(store,JSON.parse(raw))}catch(e){}
function persist(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){showStatus("This device's storage is full or blocked, so changes may not be kept.")}}
function loadFromStore(){
  const n={};Object.entries(store.docs).forEach(([p,v])=>{if(p.startsWith("days/")&&v&&v.date)n[v.date]=v});days=n;
  if(store.docs["config/main"])cfg=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),store.docs["config/main"]);
}
let sb=null,session=null,allowed=false,syncing=false,syncAgain=false,syncTimer=null;
function save(path,body){
  store.docs[path]=JSON.parse(JSON.stringify(body));
  if(!store.pending.includes(path))store.pending.push(path);
  persist();setSync();
  clearTimeout(syncTimer);syncTimer=setTimeout(sync,800);
}
function setSync(t){
  const el=document.getElementById("syncstate");
  if(t){el.textContent=t;return}
  if(!session)el.textContent="Saved on this device only. Sign in to sync your devices.";
  else if(!navigator.onLine)el.textContent=store.pending.length?"Offline: changes saved here, will sync later":"Offline";
  else el.textContent=store.pending.length?"Syncing…":"Synced";
}
async function sync(){
  if(!sb||!session||!allowed||!navigator.onLine){setSync();return}
  if(syncing){syncAgain=true;return}
  syncing=true;setSync();
  try{
    for(const path of [...store.pending]){
      const body=store.docs[path];
      const {error}=await sb.from("wellbeing_docs").upsert({user_id:session.user.id,path,body},{onConflict:"user_id,path"});
      if(error)throw error;
      if(JSON.stringify(store.docs[path])===JSON.stringify(body))store.pending=store.pending.filter(p=>p!==path);
    }
    persist();
    const {data,error}=await sb.from("wellbeing_docs").select("path,body").limit(5000);
    if(error)throw error;
    let changed=false;
    data.forEach(r=>{if(store.pending.includes(r.path))return;
      if(JSON.stringify(store.docs[r.path])!==JSON.stringify(r.body)){store.docs[r.path]=r.body;changed=true}});
    persist();showStatus("");
    if(changed){loadFromStore();if(!editing&&!busyTyping())render()}
  }catch(err){setSync("Couldn't sync just now. Changes are saved on this device.");syncing=false;return}
  syncing=false;setSync();
  if(syncAgain){syncAgain=false;sync()}
}
const busyTyping=()=>{const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT")};
function showStatus(t){const s=document.getElementById("status");if(!t){s.style.display="none";return}s.textContent=t;s.style.display="block"}

const day=d=>days[d]||{date:d,h:{},r:{}};
function setDay(d,fn){
  const b=JSON.parse(JSON.stringify(day(d)));b.date=d;b.h=b.h||{};b.r=b.r||{};
  fn(b);days[d]=b;save("days/"+d,b);render();
}
function setCfg(fn){fn(cfg);save("config/main",cfg);render()}

/* ---------- Derived ---------- */
function isDone(h,d){
  const b=day(d);
  if(h.type==="bible"){const r=b.r||{};return !!(r.prov&&r.ps&&r.ot!=null&&r.nt!=null)}
  if(h.type==="window"){if(b.lastMeal)return b.lastMeal<="13:00";return !!(b.h&&b.h[h.id])}
  return !!(b.h&&b.h[h.id]);
}
function streak(h){
  let d=TODAY();if(!isDone(h,d))d=addDays(d,-1);
  let n=0;while(isDone(h,d)&&n<3650){n++;d=addDays(d,-1)}return n;
}
function fastHours(d){
  const b=day(d),p=day(addDays(d,-1));
  if(!b.firstMeal||!p.lastMeal)return null;
  const[a1,a2]=p.lastMeal.split(":").map(Number),[b1,b2]=b.firstMeal.split(":").map(Number);
  return ((24*60-(a1*60+a2))+(b1*60+b2))/60;
}

/* ---------- Render ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  document.getElementById("dlabel").textContent=(view===TODAY()?"Today, ":"")+fmtLong(view);
  document.getElementById("next").disabled=view>=TODAY();
  const app=document.getElementById("app");
  app.innerHTML=stackCard()+bibleCard()+eatingCard()+workoutCard()+weightCard()+historyCard();
  drawChart();
}

function stackCard(){
  if(editing)return editCard();
  const b=day(view);
  let html=`<div class="card"><h2>Habit stack <button class="ghost small" data-act="edit">Edit</button></h2>`;
  const total=cfg.habits.length, done=cfg.habits.filter(h=>isDone(h,view)).length;
  html+=`<div class="tiny">${done} of ${total} done${view===TODAY()?" today":""}</div>`;
  cfg.groups.forEach(g=>{
    const hs=cfg.habits.filter(h=>h.group===g);if(!hs.length)return;
    html+=`<div class="group"><div class="group-name">${esc(g)}</div>`;
    hs.forEach((h,i)=>{
      const on=isDone(h,view);
      const cue=i===0?(h.cue?esc(h.cue)+", I will":"I will"):"After "+esc(lower(hs[i-1].name))+", I will";
      const auto=h.type==="bible"?" (ticks itself when all 4 readings are done)":h.type==="window"&&b.lastMeal?" (from your last meal time)":"";
      const s=streak(h);
      html+=`<div class="habit"><button class="check ${on?"on":""}" data-act="habit" data-id="${h.id}" aria-label="${esc(h.name)}">${on?"✓":""}</button>
        <div class="txt"><div class="cue">${cue}</div><div class="name">${esc(h.name)}</div>${auto?`<div class="tiny">${auto.trim()}</div>`:""}</div>
        <div class="streak">${s?s+" day"+(s>1?"s":""):""}</div></div>`;
    });
    html+=`</div>`;
  });
  return html+`</div>`;
}
const lower=s=>s.charAt(0).toLowerCase()+s.slice(1);

function editCard(){
  let html=`<div class="card"><h2>Edit habit stack <button class="primary small" data-act="done-edit">Done</button></h2>
  <div class="tiny">Order matters: each habit is cued by the one before it. The first habit in each group uses its own cue.</div>`;
  cfg.groups.forEach(g=>{
    html+=`<div class="group-name">${esc(g)}</div>`;
    cfg.habits.forEach((h,i)=>{ if(h.group!==g)return;
      const first=cfg.habits.findIndex(x=>x.group===g)===i;
      html+=`<div class="edit-row"><input type="text" value="${esc(h.name)}" data-act="rename" data-i="${i}" aria-label="Habit name">
        <button class="ghost" data-act="up" data-i="${i}" aria-label="Move up">↑</button>
        <button class="ghost" data-act="down" data-i="${i}" aria-label="Move down">↓</button>
        ${h.type?"":`<button class="ghost" data-act="del" data-i="${i}" aria-label="Remove">✕</button>`}</div>
        ${first?`<div class="edit-row"><span class="tiny" style="width:60px">Cue</span><input type="text" value="${esc(h.cue||"")}" placeholder="e.g. When I wake up" data-act="cue" data-i="${i}"></div>`:""}`;
    });
  });
  html+=`<div class="edit-row" style="margin-top:8px"><input type="text" id="newname" placeholder="New habit"><select id="newgroup">${cfg.groups.map(g=>`<option>${esc(g)}</option>`).join("")}</select><button data-act="add">Add</button></div>
  <div class="edit-row"><span class="tiny">Goal weight (kg)</span><input type="number" step="0.1" value="${cfg.goalKg??""}" data-act="goal"></div></div>`;
  return html;
}

function bibleCard(){
  const b=day(view), r=b.r||{};
  const prov="Proverbs "+parse(view).getDate();
  const ps="Psalm "+(((doy(view)-1)%150)+1);
  const otI=r.ot!=null?r.ot:cfg.otNext, ntI=r.nt!=null?r.nt:cfg.ntNext;
  const ot=OTC[otI%OTC.length], nt=NTC[ntI%NTC.length];
  const row=(lbl,ch,key,on)=>`<div class="reading"><button class="check ${on?"on":""}" data-act="read" data-k="${key}" aria-label="${ch} read">${on?"✓":""}</button>
    <span class="lbl">${lbl}</span><a href="${ytm(ch)}" target="_blank" rel="noopener">${ch}</a></div>`;
  const otPct=Math.round((cfg.otNext/OTC.length)*100), ntPct=Math.round((cfg.ntNext/NTC.length)*100);
  return `<div class="card"><h2>Audio Bible <span class="tiny">Streetlights on YouTube Music</span></h2>
    ${row("Proverb",prov,"prov",!!r.prov)}${row("Psalm",ps,"ps",!!r.ps)}${row("Old Test.",ot,"ot",r.ot!=null)}${row("New Test.",nt,"nt",r.nt!=null)}
    <div class="tiny" style="margin-top:6px">Old Testament ${otPct}% through (Psalms and Proverbs skipped as they're daily) · New Testament ${ntPct}% through. Old and New Testament move on only when you tick them, so a missed day doesn't skip a chapter.</div>
    <details style="margin-top:6px"><summary>Set my place</summary>
      <div class="row" style="margin-top:6px"><span class="tiny">OT next</span><select data-act="setot">${OT.map(([bk])=>`<option ${OTC[cfg.otNext].startsWith(bk+" ")?"selected":""}>${bk}</option>`).join("")}</select>
      <input type="number" min="1" value="${+OTC[cfg.otNext].split(" ").pop()}" data-act="setotc" style="width:70px"></div>
      <div class="row" style="margin-top:6px"><span class="tiny">NT next</span><select data-act="setnt">${NT.map(([bk])=>`<option ${NTC[cfg.ntNext].startsWith(bk+" ")?"selected":""}>${bk}</option>`).join("")}</select>
      <input type="number" min="1" value="${+NTC[cfg.ntNext].split(" ").pop()}" data-act="setntc" style="width:70px"></div>
    </details></div>`;
}

function eatingCard(){
  const b=day(view), fh=fastHours(view);
  let verdict="";
  if(b.lastMeal)verdict=b.lastMeal<="13:00"?`<span class="ok">Finished by 1pm</span>`:`<span class="late">Finished after 1pm</span>`;
  return `<div class="card"><h2>Eating window <span class="tiny">aim: done by 1pm</span></h2>
    <div class="fastbox">
      <div><label for="fm">First meal</label><input type="time" id="fm" value="${b.firstMeal||""}" data-act="first"></div>
      <div><label for="lm">Last meal</label><input type="time" id="lm" value="${b.lastMeal||""}" data-act="last"></div>
    </div>
    <div class="row small" style="margin-top:8px">${fh!=null?`<span>Overnight fast: <b>${fh.toFixed(1)} h</b></span>`:`<span class="muted">Enter yesterday's last meal and today's first meal to see your fast.</span>`} ${verdict}</div></div>`;
}

function workoutCard(){
  const mon=mondayOf(view);
  const wk=[...Array(7)].map((_,i)=>addDays(mon,i));
  const hiit=wk.filter(d=>day(d).hiit).length, lift=wk.filter(d=>day(d).lift).length;
  const b=day(view);
  const bar=(n,c)=>`<div class="bar"><i style="width:${Math.min(100,n/3*100)}%;background:${c}"></i></div>`;
  return `<div class="card"><h2>Training <span class="tiny">week of ${fmtShort(mon)}</span></h2>
    <div class="row" style="margin-bottom:6px">
      <button class="check ${b.hiit?"on":""}" data-act="hiit" aria-label="HIIT">${b.hiit?"✓":""}</button><span>HIIT</span>
      <span style="width:14px"></span>
      <button class="check ${b.lift?"on":""}" data-act="lift" aria-label="Lift">${b.lift?"✓":""}</button><span>Lift</span>
    </div>
    <div class="target"><span class="small" style="width:44px">HIIT</span>${bar(hiit,"var(--accent)")}<span class="small" style="width:30px">${hiit}/3</span></div>
    <div class="target"><span class="small" style="width:44px">Lift</span>${bar(lift,"var(--avg)")}<span class="small" style="width:30px">${lift}/3</span></div>
    <div class="week">${wk.map(d=>{const x=day(d);return `<div class="wd ${d===view?"today":""}">${parse(d).toLocaleDateString("en-NZ",{weekday:"narrow"})}<div class="dots">${x.hiit?'<i style="background:var(--accent)" title="HIIT"></i>':""}${x.lift?'<i style="background:var(--avg)" title="Lift"></i>':""}</div></div>`}).join("")}</div>
    <div class="legend"><span><i style="background:var(--accent);height:8px;width:8px;border-radius:50%"></i>HIIT</span><span><i style="background:var(--avg);height:8px;width:8px;border-radius:50%"></i>Lift</span></div></div>`;
}

function weights(){return Object.values(days).filter(d=>typeof d.w==="number").sort((a,b)=>a.date<b.date?-1:1)}
function weightCard(){
  const ws=weights(), b=day(view);
  const last=ws[ws.length-1];
  const ago=n=>{if(!last)return null;const cut=addDays(last.date,-n);const p=ws.filter(x=>x.date<=cut).pop();return p?last.w-p.w:null};
  const fmtD=v=>v==null?"–":(v>0?"+":"")+v.toFixed(1);
  const toGoal=cfg.goalKg&&last?(last.w-cfg.goalKg):null;
  return `<div class="card"><h2>Weight <span class="seg">${[30,90,365,0].map(r=>`<button class="${range===r?"on":""}" data-act="range" data-r="${r}">${r?r===365?"1y":r+"d":"All"}</button>`).join("")}</span></h2>
    <div class="row" style="margin-bottom:10px"><input type="number" step="0.1" inputmode="decimal" placeholder="kg" value="${b.w??""}" id="wkg" aria-label="Weight in kg for ${fmtShort(view)}"><button class="primary" data-act="savew">Save for ${view===TODAY()?"today":fmtShort(view)}</button></div>
    <div class="stats">
      <div class="stat"><b>${last?last.w.toFixed(1):"–"}</b><span>latest kg</span></div>
      <div class="stat"><b>${fmtD(ago(7))}</b><span>vs 7 days</span></div>
      <div class="stat"><b>${toGoal!=null?fmtD(toGoal):fmtD(ago(30))}</b><span>${toGoal!=null?"to goal":"vs 30 days"}</span></div>
    </div>
    <div class="chartbox" id="chartbox">${ws.length<2?`<div class="muted small" style="padding:30px 0;text-align:center">Your line appears after two weigh-ins.</div>`:`<svg id="chart" role="img" aria-label="Weight over time"></svg>`}</div>
    ${ws.length>=2?`<div class="legend"><span><i style="background:var(--accent)"></i>Weigh-ins</span><span><i style="background:var(--avg)"></i>7-day average</span>${cfg.goalKg?`<span><i style="background:var(--good);height:0;border-top:2px dashed var(--good)"></i>Goal</span>`:""}</div>`:""}
  </div>`;
}

function drawChart(){
  const svg=document.getElementById("chart");if(!svg)return;
  let ws=weights();
  if(range){const cut=addDays(TODAY(),-range);ws=ws.filter(x=>x.date>=cut)}
  if(ws.length<2){svg.outerHTML=`<div class="muted small" style="padding:30px 0;text-align:center">Not enough weigh-ins in this range.</div>`;return}
  const W=svg.clientWidth||600,H=230,m={l:38,r:12,t:12,b:26};
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const t=ws.map(x=>parse(x.date).getTime());
  const t0=t[0],t1=t[t.length-1]||t0+1;
  const avg=ws.map((x,i)=>{const lo=parse(x.date).getTime()-6*864e5;const win=ws.filter((y,j)=>j<=i&&t[j]>=lo);return win.reduce((s,y)=>s+y.w,0)/win.length});
  let vals=ws.map(x=>x.w).concat(cfg.goalKg?[cfg.goalKg]:[]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(0.5,(hi-lo)*0.12);lo-=padv;hi+=padv;
  const X=v=>m.l+(t1===t0?0:(v-t0)/(t1-t0))*(W-m.l-m.r);
  const Y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b);
  const step=niceStep((hi-lo)/4);let g="";
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${+v.toFixed(1)}</text>`}
  const nx=Math.min(5,ws.length);for(let i=0;i<nx;i++){const idx=Math.round(i*(ws.length-1)/Math.max(1,nx-1));g+=`<text x="${X(t[idx])}" y="${H-8}" text-anchor="${i===0?"start":i===nx-1?"end":"middle"}" font-size="11" fill="var(--ink3)">${fmtShort(ws[idx].date)}</text>`}
  if(cfg.goalKg)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(cfg.goalKg)}" y2="${Y(cfg.goalKg)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const path=arr=>arr.map((v,i)=>(i?"L":"M")+X(t[i]).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  g+=`<path d="${path(ws.map(x=>x.w))}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" opacity=".55"/>`;
  g+=`<path d="${path(avg)}" fill="none" stroke="var(--avg)" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(ws.length<=120)ws.forEach((x,i)=>{g+=`<circle cx="${X(t[i])}" cy="${Y(x.w)}" r="3.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`});
  g+=`<line id="xh" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink3)" stroke-width="1" style="display:none"/><circle id="xd" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2" style="display:none"/>`;
  svg.innerHTML=g;
  const tip=document.getElementById("tip"),xh=svg.querySelector("#xh"),xd=svg.querySelector("#xd");
  const move=e=>{
    const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*(W/r.width);
    let bi=0,bd=1e9;t.forEach((v,i)=>{const d=Math.abs(X(v)-px);if(d<bd){bd=d;bi=i}});
    const cx=X(t[bi]);xh.setAttribute("x1",cx);xh.setAttribute("x2",cx);xh.style.display="";
    xd.setAttribute("cx",cx);xd.setAttribute("cy",Y(ws[bi].w));xd.style.display="";
    tip.innerHTML=`<b>${fmtLong(ws[bi].date)}</b><br>${ws[bi].w.toFixed(1)} kg · avg ${avg[bi].toFixed(1)}`;
    tip.style.display="block";
    const sx=r.left+cx*(r.width/W)+window.scrollX, sy=r.top+window.scrollY+8;
    tip.style.left=Math.min(sx+10,window.scrollX+document.documentElement.clientWidth-tip.offsetWidth-8)+"px";tip.style.top=sy+"px";
  };
  const leave=()=>{tip.style.display="none";xh.style.display="none";xd.style.display="none"};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",leave);
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}

function historyCard(){
  const ds=[...Array(14)].map((_,i)=>addDays(TODAY(),i-13));
  let html=`<div class="card"><h2>Last 14 days</h2><div class="grid"><table><tr><th></th>${ds.map(d=>`<th>${parse(d).getDate()}</th>`).join("")}</tr>`;
  cfg.habits.forEach(h=>{html+=`<tr><td class="n">${esc(h.name)}</td>${ds.map(d=>`<td class="c ${isDone(h,d)?"on":""}" title="${fmtShort(d)}"></td>`).join("")}</tr>`});
  [["hiit","HIIT"],["lift","Lift"]].forEach(([k,n])=>{html+=`<tr><td class="n">${n}</td>${ds.map(d=>`<td class="c ${day(d)[k]?"on":""}"></td>`).join("")}</tr>`});
  return html+`</table></div></div>`;
}

/* ---------- Events ---------- */
document.getElementById("prev").onclick=()=>{view=addDays(view,-1);render()};
document.getElementById("next").onclick=()=>{if(view<TODAY()){view=addDays(view,1);render()}};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="habit"){const h=cfg.habits.find(x=>x.id===el.dataset.id);
    if(h.type==="bible"){return} // driven by readings
    if(h.type==="window"&&day(view).lastMeal){return}
    setDay(view,b=>{b.h[h.id]=!b.h[h.id]})}
  if(a==="hiit"||a==="lift")setDay(view,b=>{b[a]=!b[a]});
  if(a==="read")toggleRead(el.dataset.k);
  if(a==="range"){range=+el.dataset.r;render()}
  if(a==="savew"){const v=parseFloat(document.getElementById("wkg").value);setDay(view,b=>{if(isNaN(v))delete b.w;else b.w=Math.round(v*10)/10})}
  if(a==="edit"){editing=true;render()}
  if(a==="done-edit"){editing=false;render()}
  if(a==="up"||a==="down"){const i=+el.dataset.i,g=cfg.habits[i].group;let j=i;
    do{j+=a==="up"?-1:1}while(j>=0&&j<cfg.habits.length&&cfg.habits[j].group!==g);
    if(j>=0&&j<cfg.habits.length)setCfg(c=>{const t=c.habits[i];c.habits[i]=c.habits[j];c.habits[j]=t})}
  if(a==="del"){const i=+el.dataset.i;setCfg(c=>c.habits.splice(i,1))}
  if(a==="add"){const n=document.getElementById("newname").value.trim(),g=document.getElementById("newgroup").value;if(!n)return;
    setCfg(c=>{const last=c.habits.map(h=>h.group).lastIndexOf(g);const h={id:"h"+Date.now().toString(36),name:n,group:g};if(last<0)c.habits.push(h);else c.habits.splice(last+1,0,h)})}
});
document.addEventListener("change",e=>{
  const el=e.target;const a=el.dataset&&el.dataset.act;if(!a)return;
  if(a==="rename"){const v=el.value.trim();if(v)setCfg(c=>{c.habits[+el.dataset.i].name=v})}
  if(a==="cue")setCfg(c=>{c.habits[+el.dataset.i].cue=el.value.trim()});
  if(a==="goal"){const v=parseFloat(el.value);setCfg(c=>{c.goalKg=isNaN(v)?null:v})}
  if(a==="first")setDay(view,b=>{if(el.value)b.firstMeal=el.value;else delete b.firstMeal});
  if(a==="last")setDay(view,b=>{if(el.value)b.lastMeal=el.value;else delete b.lastMeal});
  if(a==="setot"||a==="setotc"){const card=el.closest("details");const bk=card.querySelector('[data-act="setot"]').value;const c=+card.querySelector('[data-act="setotc"]').value||1;const i=OTC.indexOf(bk+" "+c);if(i>=0)setCfg(x=>{x.otNext=i})}
  if(a==="setnt"||a==="setntc"){const card=el.closest("details");const bk=card.querySelector('[data-act="setnt"]').value;const c=+card.querySelector('[data-act="setntc"]').value||1;const i=NTC.indexOf(bk+" "+c);if(i>=0)setCfg(x=>{x.ntNext=i})}
});
function toggleRead(k){
  const b=day(view),r=b.r||{};
  if(k==="prov"||k==="ps"){setDay(view,x=>{x.r[k]=!x.r[k]});return}
  const nextKey=k==="ot"?"otNext":"ntNext";
  if(r[k]!=null){ // untick
    const idx=r[k];
    setDay(view,x=>{delete x.r[k]});
    if(cfg[nextKey]===idx+1)setCfg(c=>{c[nextKey]=idx});
  }else{
    const idx=cfg[nextKey];
    setDay(view,x=>{x.r[k]=idx});
    setCfg(c=>{c[nextKey]=(idx+1)%(k==="ot"?OTC.length:NTC.length)});
  }
}
window.addEventListener("resize",()=>drawChart());

/* ---------- Sign in ---------- */
function signinCard(msg){
  const el=document.getElementById("signin");
  el.innerHTML=`<h2>Sign in to sync</h2><div class="small muted">Use the email you sign in to the onboarding dashboard with. We'll email you a link; open it on this device.</div>
    <input type="email" id="em" placeholder="you@example.co.nz" autocomplete="email"><div class="row"><button class="primary" id="sendlink">Email me a link</button><button class="ghost small" id="later">Not now</button></div>${msg?`<div class="small" style="margin-top:6px">${msg}</div>`:""}`;
  el.style.display="block";
  document.getElementById("later").onclick=()=>{el.style.display="none"};
  document.getElementById("sendlink").onclick=async()=>{
    const email=document.getElementById("em").value.trim();if(!email)return;
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
    signinCard(error?"That didn't work. Check the email address, or try again in a minute.":"Check your email and open the link on this device.");
  };
}
async function onSession(s){
  session=s;const btn=document.getElementById("acctbtn");
  if(!session){allowed=false;btn.textContent="Sign in";btn.onclick=()=>signinCard();setSync();return}
  btn.textContent="Sign out";btn.onclick=async()=>{await sb.auth.signOut()};
  document.getElementById("signin").style.display="none";
  const {data,error}=await sb.rpc("is_agent");
  if(error){setSync("Couldn't check your account just now.");return}
  allowed=!!data;
  if(!allowed){setSync("This account can't use the wellbeing app.");return}
  sync();
}

/* ---------- Boot ---------- */
loadFromStore();render();setSync();
if(window.supabase){
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.getSession().then(({data})=>{onSession(data.session);if(!data.session)signinCard()});
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"||ev==="SIGNED_OUT")onSession(s)});
}
window.addEventListener("online",()=>sync());
window.addEventListener("offline",()=>setSync());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(TODAY()!==openedOn){if(view===openedOn)view=TODAY();openedOn=TODAY();render()}sync()}});
setInterval(()=>{if(document.visibilityState==="visible")sync()},60000);
/* ---------- Install and offline ---------- */
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById("installbtn");b.style.display="";b.onclick=async()=>{b.style.display="none";deferredInstall.prompt();deferredInstall=null}});
</script>
